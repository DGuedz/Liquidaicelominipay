      <text x="36" y="64" fill="#90A0AF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="500">TOTAL BALANCE</text>
      <rect x="280" y="34" width="128" height="50" rx="25" fill="#2F5E3E" opacity="0.62"/>
      <text x="312" y="66" fill="#CBF6D5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Active</text>

      <text x="36" y="166" fill="#F4FFF9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="82" font-weight="800">$5.57</text>
      <text x="36" y="218" fill="#A3E37D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="600">+2.4% APY · +$0.01 this month</text>

      <text x="36" y="314" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="500">•••• •••• •••• 3424</text>
      <text x="334" y="314" fill="#CFD8E8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">MiniPay</text>
    </g>

    <g transform="translate(42 572)">
      <rect x="0" y="0" width="98" height="98" rx="26" fill="#0F1721" stroke="#2A3340"/>
      <rect x="114" y="0" width="98" height="98" rx="26" fill="#0F1721" stroke="#2A3340"/>
      <rect x="228" y="0" width="98" height="98" rx="26" fill="#0F1721" stroke="#2A3340"/>
      <rect x="342" y="0" width="98" height="98" rx="26" fill="#0F1721" stroke="#2A3340"/>
      <text x="30" y="58" fill="#35EA8D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="700">↗</text>
      <text x="144" y="58" fill="#35EA8D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="700">↘</text>
      <text x="258" y="58" fill="#35EA8D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="700">⚡</text>
      <text x="372" y="58" fill="#35EA8D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="700">◫</text>
    </g>

    <g transform="translate(42 698)">
      <rect x="0" y="0" width="436" height="116" rx="30" fill="#0D1520" stroke="#2A3340"/>
      <rect x="16" y="24" width="48" height="48" rx="16" fill="#123123"/>
      <circle cx="40" cy="48" r="8" fill="#3AF08F"/>
      <text x="78" y="52" fill="#F1FAFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">LiquidAI Agent</text>
      <rect x="294" y="24" width="126" height="40" rx="20" fill="#193825"/>
      <text x="328" y="50" fill="#C8F8D7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Online</text>
      <text x="78" y="88" fill="#7F92A4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="500">Autonomous treasury active</text>
    </g>

    <g transform="translate(22 802)">
      <rect x="0" y="0" width="476" height="36" rx="18" fill="#080F19"/>
      <rect x="30" y="12" width="56" height="8" rx="4" fill="#1EE57E"/>
      <rect x="166" y="12" width="36" height="8" rx="4" fill="#8B99AA"/>
      <rect x="272" y="12" width="36" height="8" rx="4" fill="#8B99AA"/>
      <rect x="380" y="12" width="36" height="8" rx="4" fill="#8B99AA"/>
    </g>
  </g>

  <text x="96" y="1036" fill="#6E7E93" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="500">SYNTHESIS 2026 • LiquidAI Agentic Treasury OS • @dg_doublegreen</text>
</svg>
