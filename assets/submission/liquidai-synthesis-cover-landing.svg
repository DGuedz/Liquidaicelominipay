<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LiquidAI Synthesis cover inspired by landing hero">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1920" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#020408"/>
      <stop offset="0.58" stop-color="#03120C"/>
      <stop offset="1" stop-color="#070E17"/>
    </linearGradient>

    <radialGradient id="heroGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(920 470) rotate(90) scale(460 760)">
      <stop stop-color="#0DD36F" stop-opacity="0.24"/>
      <stop offset="0.55" stop-color="#0DD36F" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0DD36F" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="rightGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1650 220) rotate(122) scale(540 440)">
      <stop stop-color="#1D8DFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#1D8DFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="greenText" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3BFF9A"/>
      <stop offset="1" stop-color="#11D171"/>
    </linearGradient>

    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26F27F"/>
      <stop offset="1" stop-color="#11D171"/>
    </linearGradient>

    <linearGradient id="phoneBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E2C4B"/>
      <stop offset="1" stop-color="#202A45"/>
    </linearGradient>

    <linearGradient id="balanceGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9BEA62" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#18B96A" stop-opacity="0.08"/>
    </linearGradient>

    <filter id="shadowLg" x="0" y="0" width="220%" height="220%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <filter id="shadowMd" x="0" y="0" width="200%" height="200%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <ellipse cx="920" cy="470" rx="780" ry="480" fill="url(#heroGlow)"/>
  <ellipse cx="1650" cy="220" rx="500" ry="360" fill="url(#rightGlow)"/>

  <!-- top nav -->
  <g transform="translate(92 42)">
    <circle cx="20" cy="20" r="20" fill="#0F3123"/>
    <circle cx="20" cy="20" r="7" fill="#22E07C"/>
    <text x="54" y="28" fill="#F1FFF8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="44" font-weight="800">LiquidAI</text>
  </g>
  <g transform="translate(1578 34)">
    <rect x="0" y="0" width="238" height="74" rx="37" fill="#171C25" stroke="#333B49"/>
    <text x="58" y="48" fill="#E7EDF8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="600">Launch App</text>
  </g>

  <!-- left hero -->
  <g transform="translate(96 190)">
    <rect x="0" y="0" width="370" height="58" rx="29" fill="#0B291E" stroke="#1C6447"/>
    <circle cx="28" cy="29" r="8" fill="#24EA82"/>
    <text x="50" y="39" fill="#35E88A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="600">Built for the MiniPay Ecosystem</text>

    <text x="0" y="168" fill="#F1FFF6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="122" font-weight="800">Hold &amp; Earn.</text>
    <text x="0" y="314" fill="url(#greenText)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="122" font-weight="800">Zero</text>
    <text x="0" y="458" fill="url(#greenText)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="122" font-weight="800">complexity.</text>

    <text x="0" y="548" fill="#A9B6C8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="52" font-weight="500">LiquidAI turns your MiniPay wallet into an autonomous treasury.</text>
    <text x="0" y="614" fill="#A9B6C8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="52" font-weight="500">Keep your local cash in stablecoins and earn daily rewards.</text>

    <g transform="translate(0 678)">
      <rect x="0" y="0" width="430" height="106" rx="53" fill="url(#cta)" filter="url(#shadowMd)"/>
      <text x="70" y="68" fill="#03150F" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="44" font-weight="800">Explore Mini App</text>
      <text x="368" y="68" fill="#03150F" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="44" font-weight="800">→</text>

      <rect x="452" y="0" width="392" height="106" rx="53" fill="#111B1D" stroke="#334044"/>
      <text x="522" y="68" fill="#D8E2E6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="44" font-weight="600">View Documentation</text>
    </g>

    <g transform="translate(0 838)">
      <text x="0" y="32" fill="#8A98AB" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="40" font-weight="500">◌ Celo Network</text>
      <text x="344" y="32" fill="#8A98AB" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="40" font-weight="500">◌ Self Protocol</text>
      <text x="708" y="32" fill="#8A98AB" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="40" font-weight="500">◌ Karma Reputation</text>
    </g>
  </g>

  <!-- right phone mockup -->
  <g transform="translate(1288 170)" filter="url(#shadowLg)">
    <rect x="0" y="0" width="520" height="860" rx="64" fill="#040912" stroke="url(#phoneBorder)" stroke-width="10"/>
    <rect x="22" y="22" width="476" height="816" rx="52" fill="#050A13"/>

    <text x="56" y="88" fill="#E9F0FC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">9:41</text>
    <circle cx="436" cy="80" r="10" fill="#A5AFBC" opacity="0.24"/>
    <circle cx="468" cy="80" r="10" fill="#A5AFBC" opacity="0.24"/>

    <circle cx="70" cy="142" r="16" fill="#1EE57E" opacity="0.85"/>
    <text x="102" y="152" fill="#F2FAFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="40" font-weight="800">LiquidAI</text>

    <g transform="translate(42 188)">
