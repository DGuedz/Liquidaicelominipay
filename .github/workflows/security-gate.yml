name: Security Gate

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Secret leak guard
        run: pnpm run security:secrets

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Critical dependency policy check
        run: pnpm run security:deps

      - name: Vulnerability audit (high+)
        run: pnpm run security:audit

      - name: Build
        run: pnpm run build
