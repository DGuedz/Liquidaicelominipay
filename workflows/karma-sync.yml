name: Karma Sync — AI Product Manager

on:
  push:
    branches: [main, develop]
    paths:
      - "src/**"
      - "roadmap/**"
      - "karma.config.ts"
  workflow_dispatch:
    inputs:
      title:
        description: "Update title (manual post)"
        required: true
        default: "Manual milestone update"
      text:
        description: "Update text / progress notes"
        required: true

# Only run one sync at a time
concurrency:
  group: karma-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─── Job 1: Detect changed files & map to milestones ────────────────────────
  detect-changes:
    name: Detect Milestone Changes
    runs-on: ubuntu-latest
    outputs:
      has_src_changes: ${{ steps.filter.outputs.src }}
      changed_files: ${{ steps.changed.outputs.files }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get changed files
        id: changed
        run: |
          FILES=$(git diff --name-only HEAD~1 HEAD | tr '\n' ',')
          echo "files=$FILES" >> $GITHUB_OUTPUT
          echo "Changed files: $FILES"

      - name: Check for src changes
        id: filter
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q "^src/"; then
            echo "src=true" >> $GITHUB_OUTPUT
          else
            echo "src=false" >> $GITHUB_OUTPUT
          fi

  # ─── Job 2: Post update to Karma ────────────────────────────────────────────
  post-karma-update:
    name: Post to Karma Protocol
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.has_src_changes == 'true' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Extract commit context
        id: context
        run: |
          echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "author=${{ github.actor }}" >> $GITHUB_OUTPUT
          MSG="${{ github.event.head_commit.message || github.event.inputs.title }}"
          echo "message=${MSG}" >> $GITHUB_OUTPUT

      - name: Post update to Karma
        env:
          KARMA_API_KEY: ${{ secrets.KARMA_API_KEY }}
          KARMA_PROJECT_UID: ${{ secrets.KARMA_PROJECT_UID }}
          COMMIT_SHA: ${{ steps.context.outputs.sha }}
          COMMIT_MESSAGE: ${{ steps.context.outputs.message }}
          COMMIT_AUTHOR: ${{ steps.context.outputs.author }}
          CHANGED_FILES: ${{ needs.detect-changes.outputs.changed_files }}
          MANUAL_TITLE: ${{ github.event.inputs.title }}
          MANUAL_TEXT: ${{ github.event.inputs.text }}
        run: |
          node -e "
          const { runCIUpdate } = require('./src/agents/dev-agent');

          const isManual = '${{ github.event_name }}' === 'workflow_dispatch';

          if (isManual) {
            const { quickPost } = require('./src/agents/dev-agent');
            quickPost({
              apiKey: process.env.KARMA_API_KEY,
              projectUID: process.env.KARMA_PROJECT_UID,
              title: process.env.MANUAL_TITLE,
              text: process.env.MANUAL_TEXT,
            }).then(() => console.log('Manual update posted')).catch(console.error);
          } else {
            runCIUpdate({
              apiKey: process.env.KARMA_API_KEY,
              projectUID: process.env.KARMA_PROJECT_UID,
              commitSha: process.env.COMMIT_SHA,
              commitMessage: process.env.COMMIT_MESSAGE,
              changedFiles: process.env.CHANGED_FILES.split(',').filter(Boolean),
              author: process.env.COMMIT_AUTHOR,
              repoUrl: 'https://github.com/${{ github.repository }}',
            }).then(() => console.log('Commit update posted')).catch(console.error);
          }
          " 2>&1 || echo "Warning: Karma update failed (non-blocking)"

      - name: Update roadmap progress
        if: success()
        run: |
          echo "✅ Karma sync complete for commit ${{ github.sha }}"
          echo "Project: LiquidAI | Chain: Celo (42220)"
          echo "Commit: ${{ github.event.head_commit.message }}"

  # ─── Job 3: Milestone completion check ──────────────────────────────────────
  check-milestones:
    name: Check Milestone Completion
    runs-on: ubuntu-latest
    needs: post-karma-update
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Read milestone progress
        id: milestones
        run: |
          PROGRESS=$(node -e "
            const m = require('./roadmap/milestones.json');
            const completed = m.milestones.filter(ms => ms.progress >= 100);
            const inProgress = m.milestones.filter(ms => ms.progress > 0 && ms.progress < 100);
            console.log('Overall:', m.overallProgress + '%');
            console.log('Completed:', completed.map(c => c.name).join(', ') || 'None');
            console.log('In Progress:', inProgress.map(p => p.name + ' (' + p.progress + '%)').join(', '));
          ")
          echo "$PROGRESS"

      - name: Summary
        run: |
          echo "## 🚀 LiquidAI × Karma Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Project | LiquidAI |" >> $GITHUB_STEP_SUMMARY
          echo "| Chain | Celo (42220) |" >> $GITHUB_STEP_SUMMARY
          echo "| Hackathon | Build Agents for the Real World V2 |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Milestones tracked on Karma Protocol ✅**" >> $GITHUB_STEP_SUMMARY
